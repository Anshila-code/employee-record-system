
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | Employee Record System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'index' %}">
                <span class="brand-icon">ER</span>
                Employee Records
            </a>

            <span class="navbar-text text-white">
                Management Dashboard
            </span>

        </div>
    </nav>

    <!-- Main Container -->
    <div class="container form-page">

        <div class="form-card">

            <!-- Heading -->
            <div class="form-heading">

                <div class="form-icon edit-icon">
                    ✎
                </div>

                <h2>Edit Employee Details</h2>

                <p>Update the employee information below.</p>

            </div>

            <!-- Edit Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control custom-input"
                        value="{{ employee.name }}"
                        placeholder="Enter employee name"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        class="form-control custom-input"
                        value="{{ employee.department }}"
                        placeholder="Enter department"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Salary (₹)
                    </label>

                    <input
                        type="number"
                        name="salary"
                        class="form-control custom-input"
                        value="{{ employee.salary }}"
                        placeholder="Enter salary"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

                <!-- Buttons -->
                <div class="form-buttons">

                    <button type="submit" class="btn btn-submit">
                        Update Employee
                    </button>

                    <a href="{% url 'index' %}" class="btn btn-back">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

        <!-- Footer -->
        <footer>
            Employee Record System © 2026 | All Rights Reserved
        </footer>

    </div>

</body>
</html>
